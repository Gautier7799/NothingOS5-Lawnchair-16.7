name: Build Lawnchair APK

on:
  workflow_dispatch:
  push:
    branches:
      - foundation/lawnchair-16-dev
      - feature/bundled-lawnicons
    paths-ignore:
      - '.github/**'
      - '**.md'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source with submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          submodules: recursive
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Generate and bundle Lawnicons resources
        run: |
          git clone https://github.com/LawnchairLauncher/lawnicons.git /tmp/lawnicons
          git -C /tmp/lawnicons checkout 6a75594bd0553e35118beb02b655f87e3ebd956a
          /tmp/lawnicons/gradlew -p /tmp/lawnicons :svg-processor:run
          python3 scripts/merge_lawnicons.py /tmp/lawnicons
      - name: Build Lawnchair GitHub Debug APK
        run: ./gradlew assembleLawnWithQuickstepGithubDebug --stacktrace
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lawnchair-16-dev-github-debug
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
