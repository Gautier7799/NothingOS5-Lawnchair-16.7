name: Build Lawnchair APK

on:
  workflow_dispatch:
  push:
    branches:
      - foundation/lawnchair-16-dev
    paths-ignore:
      - '.github/**'
      - '**.md'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source with submodules
        uses: actions/checkout@v4
        with:
          ref: foundation/lawnchair-16-dev
          submodules: recursive
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Lawnchair GitHub Debug APK
        run: ./gradlew assembleLawnWithQuickstepGithubDebug --stacktrace
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lawnchair-16-dev-github-debug
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
