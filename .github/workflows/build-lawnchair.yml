name: Build Lawnchair

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - foundation/lawnchair-16-dev
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate and bundle Lawnicons resources
        run: |
          git clone https://github.com/LawnchairLauncher/lawnicons.git /tmp/lawnicons
          git -C /tmp/lawnicons checkout "$(cat scripts/lawnicons-revision.txt)"
          /tmp/lawnicons/gradlew -p /tmp/lawnicons :svg-processor:run
          python3 scripts/merge_lawnicons.py /tmp/lawnicons

      - name: Check formatting
        run: ./gradlew spotlessCheck --stacktrace

      - name: Run Lawnchair unit tests
        run: ./gradlew testLawnWithQuickstepGithubDebugUnitTest --stacktrace

      - name: Build GitHub Debug APK
        run: ./gradlew assembleLawnWithQuickstepGithubDebug --stacktrace

      # Verifies that R8 (minifyEnabled + shrinkResources) can actually shrink
      # this project. It had never been exercised before, so the first failure
      # would otherwise have surfaced during a real release.
      # NOTE: without keystore.properties the release variant falls back to the
      # debug signing config (see build.gradle). The APK is a shrink test, not a
      # publishable artifact.
      - name: Build GitHub Release APK
        run: ./gradlew assembleLawnWithQuickstepGithubRelease --stacktrace

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lawnchair-github-apks
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      # Advisory only: the project inherits ~2500 lint findings from the
      # upstream AOSP tree (filtered by lint.xml). A hard gate would block every
      # PR until that debt is paid down, so a non-zero exit here is reported as
      # a warning instead of failing the job.
      - name: Run lint (advisory)
        run: ./gradlew :lintLawnWithQuickstepGithubDebug --stacktrace || \
          echo "::warning::Lint reported findings (see the lint-report artifact)"

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
